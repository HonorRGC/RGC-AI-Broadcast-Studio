[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rgc-ai-broadcast-studio"
version = "0.18.0"
description = "AI-directed iRacing broadcast production"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "elevenlabs>=2.0,<3",
    "openai>=2.0,<3",
    "pyirsdk>=1.3",
    "python-dotenv>=1.0",
]

[project.scripts]
rgc-broadcast = "app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
py-modules = ["app", "config"]

[tool.setuptools.packages.find]
include = [
    "broadcast*",
    "broadcaster*",
    "helpers*",
    "production*",
    "replay*",
    "voice*",
]
